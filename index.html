<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iuran PGRI SMAN 1 Singkep Selatan</title>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    
    @keyframes scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    
    .scrolling-text {
      animation: scroll 25s linear infinite;
    }
    
    .scrolling-text:hover {
      animation-play-state: paused;
    }
    
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    .status-lunas {
      background-color: #dcfce7;
      color: #166534;
    }
    
    .status-belum {
      background-color: #fee2e2;
      color: #991b1b;
    }
    
    @media print {
      body * {
        visibility: hidden;
      }
      .print-area, .print-area * {
        visibility: visible;
      }
      .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="min-h-full">
  <div id="app" class="min-h-full"></div>
  <script>
    const defaultConfig = {
      judul_utama: "IURAN PGRI",
      subjudul: "SMAN 1 SINGKEP SELATAN",
      label_no: "No",
      label_nama: "Nama",
      label_jabatan: "Jabatan",
      label_bulan: "Bulan / Status",
      label_total: "Total",
      label_aksi: "Aksi",
      tombol_tambah: "+ Tambah Data",
      tombol_cetak: "Cetak",
      background_color: "#f0f9ff",
      card_color: "#ffffff",
      primary_color: "#0284c7",
      text_color: "#0f172a",
      accent_color: "#0ea5e9",
      font_family: "Inter",
      font_size: 16
    };

    let allData = [];
    let isLoading = false;
    let selectedYear = 2024;
    let filteredData = [];
    let sortBy = 'nama'; // 'nama' or 'jabatan'
    let sortOrder = 'asc'; // 'asc' or 'desc'
    let csvData = []; // Store parsed CSV data for preview
    let currentTab = 'manual'; // Track current tab

    const dataHandler = {
      onDataChanged(data) {
        allData = data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        filterDataByYear();
        renderApp();
      }
    };

    function filterDataByYear() {
      filteredData = allData.filter(record => {
        const paymentYear = new Date(record.tanggal_bayar).getFullYear();
        return paymentYear === selectedYear;
      });
      sortData();
    }

    function sortData() {
      // Group data by person name first
      const groupedData = {};
      filteredData.forEach(record => {
        if (!groupedData[record.nama]) {
          groupedData[record.nama] = {
            person: record,
            payments: []
          };
        }
        groupedData[record.nama].payments.push(record);
      });

      // Sort the grouped data
      const sortedPersons = Object.keys(groupedData).sort((a, b) => {
        const personA = groupedData[a].person;
        const personB = groupedData[b].person;
        
        let valueA, valueB;
        if (sortBy === 'nama') {
          valueA = personA.nama.toLowerCase();
          valueB = personB.nama.toLowerCase();
        } else {
          valueA = personA.jabatan.toLowerCase();
          valueB = personB.jabatan.toLowerCase();
        }

        if (sortOrder === 'asc') {
          return valueA.localeCompare(valueB, 'id');
        } else {
          return valueB.localeCompare(valueA, 'id');
        }
      });

      // Rebuild filteredData in sorted order
      filteredData = [];
      sortedPersons.forEach(personName => {
        filteredData.push(...groupedData[personName].payments);
      });
    }

    function changeSorting(newSortBy) {
      if (sortBy === newSortBy) {
        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
      } else {
        sortBy = newSortBy;
        sortOrder = 'asc';
      }
      filterDataByYear();
      renderApp();
    }

    function changeYear(year) {
      selectedYear = year;
      filterDataByYear();
      renderApp();
    }

    async function initApp() {
      // Show loading indicator
      showLoadingState();
      
      const result = await window.dataSdk.init(dataHandler);
      if (!result.isOk) {
        console.error("Failed to initialize data SDK");
        hideLoadingState();
        showToast("Gagal menginisialisasi sistem data", "error");
        return;
      }

      // Hide loading indicator once data is loaded
      hideLoadingState();
    }

    function showLoadingState() {
      const app = document.getElementById('app');
      const config = window.elementSdk?.config || defaultConfig;
      const baseSize = config.font_size || defaultConfig.font_size;
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const backgroundColor = config.background_color || defaultConfig.background_color;
      
      app.style.backgroundColor = backgroundColor;
      app.innerHTML = `
        <div class="min-h-full flex items-center justify-center p-8">
          <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-gray-300 mb-6" style="border-top-color: ${primaryColor};"></div>
            <h2 class="font-bold mb-2" style="font-size: ${baseSize * 1.5}px; color: ${primaryColor};">
              Memuat Data Iuran PGRI
            </h2>
            <p class="text-gray-600" style="font-size: ${baseSize}px;">
              Sedang mengambil data dari Canva Sheet...
            </p>
            <div class="mt-4 flex justify-center">
              <div class="flex space-x-1">
                <div class="w-2 h-2 rounded-full animate-pulse" style="background-color: ${primaryColor};"></div>
                <div class="w-2 h-2 rounded-full animate-pulse" style="background-color: ${primaryColor}; animation-delay: 0.2s;"></div>
                <div class="w-2 h-2 rounded-full animate-pulse" style="background-color: ${primaryColor}; animation-delay: 0.4s;"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function hideLoadingState() {
      // Loading state will be replaced by renderApp() call from onDataChanged
    }

    function getMonthlyPayments(personName, year) {
      const months = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];
      
      const payments = {};
      months.forEach(month => {
        payments[month] = null;
      });

      allData.forEach(record => {
        if (record.nama === personName) {
          const recordYear = new Date(record.tanggal_bayar).getFullYear();
          if (recordYear === year) {
            const monthName = record.bulan.split(' ')[0];
            if (payments.hasOwnProperty(monthName)) {
              payments[monthName] = record;
            }
          }
        }
      });

      return payments;
    }

    function showDetailModal(personName) {
      const detailModal = document.getElementById('detailModal');
      if (detailModal) {
        // Update modal content with person's data
        updateDetailModalContent(personName);
        detailModal.classList.remove('hidden');
      }
    }

    function closeDetailModal() {
      const modal = document.getElementById('detailModal');
      if (modal) {
        modal.classList.add('hidden');
      }
    }

    function updateDetailModalContent(personName) {
      const config = window.elementSdk?.config || defaultConfig;
      const baseSize = config.font_size || defaultConfig.font_size;
      const customFont = config.font_family || defaultConfig.font_family;
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const cardColor = config.card_color || defaultConfig.card_color;

      const payments2024 = getMonthlyPayments(personName, 2024);
      const payments2025 = getMonthlyPayments(personName, 2025);
      
      const months = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];

      function renderYearCalendar(payments, year) {
        return `
          <div class="mb-6">
            <h4 class="font-bold mb-3" style="font-size: ${baseSize * 1.1}px; color: ${primaryColor};">
              Tahun ${year}
            </h4>
            <div class="grid grid-cols-3 md:grid-cols-4 gap-2">
              ${months.map(month => {
                const payment = payments[month];
                const isLunas = payment && payment.status_bayar === 'Lunas';
                const isBelumLunas = payment && payment.status_bayar === 'Belum Lunas';
                
                return `
                  <div class="p-2 rounded-lg border text-center text-sm ${
                    isLunas ? 'bg-green-100 border-green-300' : 
                    isBelumLunas ? 'bg-red-100 border-red-300' : 
                    'bg-gray-100 border-gray-300'
                  }" style="font-size: ${baseSize * 0.8}px;">
                    <div class="font-medium" style="color: ${textColor};">${month}</div>
                    <div class="text-xs mt-1" style="color: ${
                      isLunas ? '#166534' : 
                      isBelumLunas ? '#991b1b' : 
                      '#6b7280'
                    };">
                      ${isLunas ? '✓ Lunas' : isBelumLunas ? '✗ Belum' : '- Belum Ada'}
                    </div>
                    ${payment ? `
                      <div class="text-xs mt-1" style="color: #6b7280;">
                        ${formatDate(payment.tanggal_bayar)}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      const modalContent = document.getElementById('detailModalContent');
      if (modalContent) {
        modalContent.innerHTML = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="font-bold" style="font-size: ${baseSize * 1.5}px; color: ${primaryColor};">
              Detail Pembayaran
            </h2>
            <button 
              onclick="closeDetailModal()"
              class="text-gray-500 hover:text-gray-700 text-2xl font-bold"
            >
              ×
            </button>
          </div>

          <div class="mb-4">
            <h3 class="font-bold mb-2" style="font-size: ${baseSize * 1.2}px; color: ${textColor};">
              ${personName}
            </h3>
          </div>

          ${renderYearCalendar(payments2024, 2024)}
          ${renderYearCalendar(payments2025, 2025)}

          <div class="mt-6 p-4 rounded-lg" style="background-color: #f8fafc;">
            <div class="grid grid-cols-2 gap-4 text-center">
              <div>
                <div class="font-semibold" style="color: ${textColor}; font-size: ${baseSize * 0.9}px;">
                  Total Lunas 2024
                </div>
                <div class="font-bold text-green-600" style="font-size: ${baseSize * 1.2}px;">
                  ${Object.values(payments2024).filter(p => p && p.status_bayar === 'Lunas').length} bulan
                </div>
              </div>
              <div>
                <div class="font-semibold" style="color: ${textColor}; font-size: ${baseSize * 0.9}px;">
                  Total Lunas 2025
                </div>
                <div class="font-bold text-green-600" style="font-size: ${baseSize * 1.2}px;">
                  ${Object.values(payments2025).filter(p => p && p.status_bayar === 'Lunas').length} bulan
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(amount);
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('id-ID', { 
        day: '2-digit', 
        month: 'short', 
        year: 'numeric' 
      });
    }

    async function handleAddData(event) {
      event.preventDefault();
      
      if (allData.length >= 999) {
        showToast("Batas maksimum 999 data tercapai. Hapus beberapa data terlebih dahulu.", "error");
        return;
      }

      const formData = new FormData(event.target);
      const nama = formData.get('nama').trim();
      const jabatan = formData.get('jabatan').trim();
      const tahun = formData.get('tahun');
      const tanggal_bayar = formData.get('tanggal_bayar');
      const status_bayar = formData.get('status_bayar');
      const total_pembayaran = parseFloat(formData.get('total_pembayaran'));

      // Ambil semua bulan yang dipilih
      const selectedMonths = formData.getAll('bulan_pilihan');

      if (!nama || !jabatan || selectedMonths.length === 0 || !tahun || !tanggal_bayar || !status_bayar || isNaN(total_pembayaran)) {
        showToast("Mohon lengkapi semua field dan pilih minimal satu bulan", "error");
        return;
      }

      // Cek apakah total data yang akan ditambahkan melebihi batas
      if (allData.length + selectedMonths.length > 999) {
        showToast(`Tidak dapat menambahkan ${selectedMonths.length} data. Batas maksimum 999 data akan terlampaui.`, "error");
        return;
      }

      isLoading = true;
      renderApp();

      let successCount = 0;
      let failedMonths = [];

      // Validasi jumlah pembayaran sesuai aturan
      if (total_pembayaran !== 15000 && total_pembayaran !== 25000) {
        showToast("Jumlah pembayaran harus sesuai dengan aturan yang berlaku", "error");
        return;
      }

      // Buat data untuk setiap bulan yang dipilih
      for (const bulan_nama of selectedMonths) {
        const bulan = `${bulan_nama} ${tahun}`;
        
        const newData = {
          id: `${Date.now()}_${bulan_nama}_${Math.random().toString(36).substr(2, 9)}`,
          nama,
          jabatan,
          bulan,
          tanggal_bayar,
          status_bayar,
          total_pembayaran: total_pembayaran, // Gunakan nilai yang dipilih user
          created_at: new Date().toISOString()
        };

        const result = await window.dataSdk.create(newData);
        
        if (result.isOk) {
          successCount++;
        } else {
          failedMonths.push(bulan_nama);
        }
      }
      
      isLoading = false;

      if (successCount === selectedMonths.length) {
        event.target.reset();
        closeModal();
        const totalKeseluruhan = total_pembayaran * selectedMonths.length;
        showToast(`Berhasil menambahkan ${successCount} data pembayaran (${formatCurrency(total_pembayaran)}/bulan × ${selectedMonths.length} bulan = ${formatCurrency(totalKeseluruhan)})`, "success");
      } else if (successCount > 0) {
        showToast(`Berhasil menambahkan ${successCount} dari ${selectedMonths.length} data. Gagal: ${failedMonths.join(', ')}`, "error");
        renderApp();
      } else {
        showToast("Gagal menambahkan semua data", "error");
        renderApp();
      }
    }

    async function handleDelete(record) {
      const deleteBtn = document.querySelector(`[data-delete-id="${record.id}"]`);
      if (!deleteBtn) return;

      if (deleteBtn.textContent === 'Hapus') {
        deleteBtn.textContent = 'Yakin?';
        deleteBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
        deleteBtn.classList.add('bg-red-700');
        
        setTimeout(() => {
          if (deleteBtn) {
            deleteBtn.textContent = 'Hapus';
            deleteBtn.classList.remove('bg-red-700');
            deleteBtn.classList.add('bg-red-500', 'hover:bg-red-600');
          }
        }, 3000);
        return;
      }

      isLoading = true;
      renderApp();

      const result = await window.dataSdk.delete(record);
      
      isLoading = false;

      if (result.isOk) {
        showToast("Data berhasil dihapus", "success");
      } else {
        showToast("Gagal menghapus data", "error");
        renderApp();
      }
    }

    function showEditModal(personName) {
      // Find the first record for this person to get current data
      const personRecord = allData.find(record => record.nama === personName);
      if (!personRecord) return;

      const editModal = document.getElementById('editModal');
      if (editModal) {
        // Populate form with current data
        document.getElementById('editNama').value = personRecord.nama;
        document.getElementById('editJabatan').value = personRecord.jabatan;
        document.getElementById('editPersonName').value = personName;
        editModal.classList.remove('hidden');
      }
    }

    function showDeletePersonModal(personName) {
      const deleteModal = document.getElementById('deletePersonModal');
      if (deleteModal) {
        // Populate form with person name
        document.getElementById('deletePersonName').value = personName;
        document.getElementById('deletePersonNameDisplay').textContent = personName;
        deleteModal.classList.remove('hidden');
      }
    }

    function closeDeletePersonModal() {
      const modal = document.getElementById('deletePersonModal');
      if (modal) {
        modal.classList.add('hidden');
        document.getElementById('deletePersonForm').reset();
      }
    }

    async function handleDeletePersonSubmit(event) {
      event.preventDefault();
      
      const formData = new FormData(event.target);
      const personName = formData.get('personName');
      const adminPassword = formData.get('adminPassword');
      const confirmText = formData.get('confirmText');

      // Validasi password admin
      if (adminPassword !== '4dminPGRI') {
        showToast('Password admin salah!', 'error');
        return;
      }

      // Validasi konfirmasi text
      if (confirmText !== 'HAPUS SEMUA') {
        showToast('Konfirmasi text tidak sesuai! Ketik: HAPUS SEMUA', 'error');
        return;
      }

      isLoading = true;
      renderApp();

      // Find all records for this person
      const personRecords = allData.filter(record => record.nama === personName);
      let successCount = 0;
      let totalRecords = personRecords.length;

      if (totalRecords === 0) {
        showToast('Tidak ada data untuk dihapus', 'error');
        isLoading = false;
        renderApp();
        return;
      }

      // Delete all records for this person
      for (const record of personRecords) {
        const result = await window.dataSdk.delete(record);
        if (result.isOk) {
          successCount++;
        }
      }

      isLoading = false;

      if (successCount === totalRecords) {
        closeDeletePersonModal();
        showToast(`Berhasil menghapus semua ${successCount} data pembayaran untuk ${personName}`, 'success');
      } else if (successCount > 0) {
        showToast(`Hanya berhasil menghapus ${successCount} dari ${totalRecords} data`, 'error');
        renderApp();
      } else {
        showToast('Gagal menghapus semua data', 'error');
        renderApp();
      }
    }

    function closeEditModal() {
      const modal = document.getElementById('editModal');
      if (modal) {
        modal.classList.add('hidden');
        document.getElementById('editForm').reset();
      }
    }

    async function handleEditSubmit(event) {
      event.preventDefault();
      
      const formData = new FormData(event.target);
      const oldName = formData.get('oldName');
      const newName = formData.get('nama').trim();
      const newJabatan = formData.get('jabatan').trim();

      if (!newName || !newJabatan) {
        showToast("Mohon lengkapi semua field", "error");
        return;
      }

      isLoading = true;
      renderApp();

      // Find all records for this person and update them
      const personRecords = allData.filter(record => record.nama === oldName);
      let successCount = 0;

      for (const record of personRecords) {
        const updatedRecord = {
          ...record,
          nama: newName,
          jabatan: newJabatan
        };

        const result = await window.dataSdk.update(updatedRecord);
        if (result.isOk) {
          successCount++;
        }
      }

      isLoading = false;

      if (successCount === personRecords.length) {
        closeEditModal();
        showToast(`Berhasil mengupdate ${successCount} data untuk ${newName}`, "success");
      } else {
        showToast(`Hanya berhasil mengupdate ${successCount} dari ${personRecords.length} data`, "error");
        renderApp();
      }
    }

      const baseSize = config.font_size || defaultConfig.font_size;

      const personPayments = allData.filter(record => record.nama === personName);

        showToast('Tidak ada data pembayaran untuk dicetak', 'error');

      }
    }

    function parseCSV(text) {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length < 2) {
        throw new Error('File CSV harus memiliki header dan minimal 1 baris data');
      }

      const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
      const expectedHeaders = ['nama', 'jabatan', 'bulan', 'tahun', 'tanggal_bayar', 'status_bayar', 'total_pembayaran'];
      
      // Validate headers
      for (const expectedHeader of expectedHeaders) {
        if (!headers.includes(expectedHeader)) {
          throw new Error(`Header '${expectedHeader}' tidak ditemukan dalam file CSV`);
        }
      }

      const data = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length !== headers.length) {
          throw new Error(`Baris ${i + 1}: Jumlah kolom tidak sesuai dengan header`);
        }

        const row = {};
        headers.forEach((header, index) => {
          row[header] = values[index];
        });

        // Validate required fields
        if (!row.nama || !row.jabatan || !row.bulan || !row.tahun || !row.tanggal_bayar || !row.status_bayar || !row.total_pembayaran) {
          throw new Error(`Baris ${i + 1}: Ada field yang kosong`);
        }

        // Validate status_bayar
        if (row.status_bayar !== 'Lunas' && row.status_bayar !== 'Belum Lunas') {
          throw new Error(`Baris ${i + 1}: Status bayar harus 'Lunas' atau 'Belum Lunas'`);
        }

        // Validate total_pembayaran
        const amount = parseInt(row.total_pembayaran);
        if (isNaN(amount) || (amount !== 15000 && amount !== 25000)) {
          throw new Error(`Baris ${i + 1}: Total pembayaran harus 15000 atau 25000`);
        }

        // Validate date format
        const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
        if (!dateRegex.test(row.tanggal_bayar)) {
          throw new Error(`Baris ${i + 1}: Format tanggal harus YYYY-MM-DD`);
        }

        data.push({
          nama: row.nama,
          jabatan: row.jabatan,
          bulan: `${row.bulan} ${row.tahun}`,
          tanggal_bayar: row.tanggal_bayar,
          status_bayar: row.status_bayar,
          total_pembayaran: amount
        });
      }

      return data;
    }

    async function handleCSVUpload(event) {
      event.preventDefault();
      
      const fileInput = event.target.csvFile;
      const file = fileInput.files[0];
      
      if (!file) {
        showToast('Pilih file CSV terlebih dahulu', 'error');
        return;
      }

      if (!file.name.toLowerCase().endsWith('.csv')) {
        showToast('File harus berformat .csv', 'error');
        return;
      }

      try {
        const text = await file.text();
        csvData = parseCSV(text);
        
        if (csvData.length === 0) {
          showToast('File CSV tidak memiliki data', 'error');
          return;
        }

        if (allData.length + csvData.length > 999) {
          showToast(`Tidak dapat mengimport ${csvData.length} data. Batas maksimum 999 data akan terlampaui.`, 'error');
          return;
        }

        showCSVPreview();
        showToast(`Berhasil memuat ${csvData.length} baris data. Silakan periksa preview dan konfirmasi.`, 'success');
        
      } catch (error) {
        showToast(`Error parsing CSV: ${error.message}`, 'error');
        csvData = [];
      }
    }

    async function confirmCSVImport() {
      if (csvData.length === 0) {
        showToast('Tidak ada data untuk diimport', 'error');
        return;
      }

      isLoading = true;
      renderApp();

      let successCount = 0;
      let failedCount = 0;

      for (const row of csvData) {
        const newData = {
          id: `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
          nama: row.nama,
          jabatan: row.jabatan,
          bulan: row.bulan,
          tanggal_bayar: row.tanggal_bayar,
          status_bayar: row.status_bayar,
          total_pembayaran: row.total_pembayaran,
          created_at: new Date().toISOString()
        };

        const result = await window.dataSdk.create(newData);
        
        if (result.isOk) {
          successCount++;
        } else {
          failedCount++;
        }
      }

      isLoading = false;
      csvData = [];

      if (successCount === csvData.length + successCount) {
        closeModal();
        showToast(`Berhasil mengimport ${successCount} data dari CSV!`, 'success');
      } else {
        showToast(`Import selesai: ${successCount} berhasil, ${failedCount} gagal`, failedCount > 0 ? 'error' : 'success');
        renderApp();
      }
    }

    function cancelCSVImport() {
      csvData = [];
      const csvPreview = document.getElementById('csvPreview');
      if (csvPreview) {
        csvPreview.classList.add('hidden');
      }
      showToast('Import CSV dibatalkan', 'success');
    }
